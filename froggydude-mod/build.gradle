plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Mixins do GeckoLib no ambiente de desenvolvimento (no jogo de verdade não precisa)
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Para testes: ./gradlew runClient -PquickWorld=nome_do_mundo abre direto no mundo
            if (project.hasProperty('quickWorld')) {
                args '--quickPlaySingleplayer', project.property('quickWorld')
            }
            if (project.hasProperty('froggyDebug')) {
                property 'froggydude.debug', 'true'
            }
            // Entrar com outro nome (ex.: -PplayerName=FroggyDudeMC pro easter egg, ver client.EasterEgg)
            if (project.hasProperty('playerName')) {
                args '--username', project.property('playerName')
            }
            // Gravar animação quadro a quadro (comparar com vídeo): -PwinW=720 -PwinH=1280
            // -PanimSlow=0.05 -Pcapture=1 (ver client.AnimCapture)
            if (project.hasProperty('winW')) {
                args '--width', project.property('winW'), '--height', project.property('winH')
            }
            if (project.hasProperty('animSlow')) {
                property 'froggydude.animSlow', project.property('animSlow')
            }
            if (project.hasProperty('openSettings')) {
                property 'froggydude.openSettings', 'true'
            }
            if (project.hasProperty('capture')) {
                property 'froggydude.capture', 'true'
            }
            // Gravar de lado: a derrubada não vira a câmera pra cara dele (-PfreeCam; ver ClientForgeEvents)
            if (project.hasProperty('freeCam')) {
                property 'froggydude.freecam', 'true'
            }
            // Testar o diretor de tensão rápido: -PdirectorScale=0.1 (todos os tempos do ciclo x 0,1)
            if (project.hasProperty('directorScale')) {
                property 'froggydude.directorScale', project.property('directorScale')
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            if (project.hasProperty('froggyDebug')) {
                property 'froggydude.debug', 'true'
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    // (v0.7.38) a voz original do FroggyDude (autorizada por ele) entra no jar como pacote interno, mas fica FORA do
    // Git (o repo é público): pasta voz-privada/, ignorada. Sem ela o jar sai sem a voz (os sons do Minecraft).
    srcDir 'voz-privada'
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup('software.bernie.geckolib')
        }
    }
    // Só pros testes (-PtestMods): mods de outros autores baixados do Modrinth
    // (repositório comum, não "exclusiveContent": o ForgeGradle serve a versão remapeada pelo repositório dele)
    if (project.hasProperty('testMods')) {
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    // Testar o roubo de arma e a fúria do Avaritia com o Re:Avaritia de verdade, e as armas de fogo com o TaCZ
    // (LM: "armas como TaCZ"): ./gradlew runClient -PtestMods (só no Minecraft de teste; não entra no jar do mod)
    if (project.hasProperty('testMods')) {
        runtimeOnly fg.deobf('maven.modrinth:re-avaritia:1.20.1-1.4.2-release')
        runtimeOnly fg.deobf('maven.modrinth:timeless-and-classics-zero:1.1.8-hotfix2')
        // as maids sem gore (v0.7.44, pedido do time do Touhou Little Maid): a mesma versão do vídeo deles
        runtimeOnly fg.deobf('maven.modrinth:touhou-little-maid:1.5.3-forge+mc1.20.1')
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            geckolib_version: geckolib_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
