name: Compilar PROTOCOL NULL Forge 1.20.1 (branch isolada)
on:
  push:
    branches: [protocol-null-ci]
    paths:
      - protocol-null-ci.zip
      - .github/workflows/compile.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extrair projeto
        run: unzip -q protocol-null-ci.zip -d build_area
      - name: Compilar e reobfuscar o mod
        working-directory: build_area/protocol-null
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build
      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL_NULL_FORGE_1_20_1
          path: build_area/protocol-null/build/libs/protocolnull-*.jar
          if-no-files-found: error
