name: Compilar Mod Forge (.zip)

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Compilar Projeto Java 17
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Forge 1.20.1)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Localizar e Extrair Arquivo ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Nenhum arquivo .zip foi encontrado na raiz!"
            exit 1
          fi
          echo "Arquivo zip encontrado: $ZIP_FILE"
          mkdir -p build_area
          unzip -o "$ZIP_FILE" -d build_area

      - name: Executar Build com Gradle
        run: |
          GRADLEW_PATH=$(find build_area -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Arquivo gradlew nao foi encontrado dentro do projeto!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Diretorio do projeto: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Disponibilizar o .jar Compilado
        uses: actions/upload-artifact@v4
        with:
          name: mod-compilado-jar
          path: |
            build_area/**/build/libs/*.jar
            !build_area/**/build/libs/*-sources.jar
            !build_area/**/build/libs/*-shadow.jar
            !build_area/**/build/libs/*-dev.jar
